    <script>
      // Theme pre-paint: read stored preference (or fall back to OS) and apply
      // it to <html> + the theme-color meta BEFORE React mounts. Without this,
      // Android Chrome shows a light-mode address bar + white background flash
      // for ~120ms before the React useEffect runs and updates everything.
      // CSP allows inline (script-src 'self' 'unsafe-inline').
      (function () {
        try {
          var stored = localStorage.getItem('mf-theme');
          var prefersDark = window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          var bg = dark ? '#0a0908' : '#f7f4ee';
          var scheme = dark ? 'dark' : 'light';
          var html = document.documentElement;
          html.setAttribute('data-theme', scheme);
          html.style.colorScheme = scheme;
          html.style.background = bg;
          var t = document.getElementById('theme-color-meta');
          if (t) t.setAttribute('content', bg);
          var c = document.getElementById('color-scheme-meta');
          if (c) c.setAttribute('content', scheme);
        } catch (e) { /* ignore — fall through to React-driven theme */ }
      })();

      // SPA-redirect catch: paired with public/404.html. If the user landed
      // here via "/?p=/some/path", restore the original path before React
      // Router mounts so deep links and refreshes work on GitHub Pages.
      (function () {
        var l = window.location;
        if (l.search.indexOf('p=/') === -1) return;
        var params = new URLSearchParams(l.search);
        var p = params.get('p');
        var q = params.get('q');
        if (p) {
          window.history.replaceState(
            null, null,
            p + (q ? '?' + q : '') + l.hash
          );
        }
      })();
    </script>
